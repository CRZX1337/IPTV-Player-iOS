name: Beta IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every commit gets its own build, so builds queue instead of cancelling each other.
concurrency:
  group: beta-ipa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish beta
    runs-on: macos-26
    env:
      PROJECT: IPTV-Player.xcodeproj
      SCHEME: IPTV-Player
      ARCHIVE_PATH: ${{ github.workspace }}/build/IPTV-Player.xcarchive

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app inside the archive"
            exit 1
          fi

          # The IPA must always ship unsigned, signing happens later with Feather.
          if [ -d "$APP/_CodeSignature" ]; then
            echo "The app came out signed, but the beta IPA has to be unsigned."
            exit 1
          fi

          # Every build raises the version, so Feather and iOS see it as an update:
          # the major and minor part come from the project, the patch is the run number.
          PLIST="$APP/Info.plist"
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | cut -d. -f1-2)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          IPA="$RUNNER_TEMP/IPTV-Player-${VERSION}-beta.${GITHUB_RUN_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$IPA"

          {
            echo "### Unsigned IPA ready"
            echo "- Version \`${VERSION}\`, build \`${GITHUB_RUN_NUMBER}\`"
            echo "- Bundle identifier \`${BUNDLE_ID}\`"
            echo "- Size $(du -h "$IPA" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-beta-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: IPTV Player ${{ steps.ipa.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ${{ steps.ipa.outputs.path }}
          body: |
            Changes: ${{ steps.ipa.outputs.subject }}

            - Version `${{ steps.ipa.outputs.version }}`, build `${{ github.run_number }}`
            - Bundle identifier `${{ steps.ipa.outputs.bundle_id }}`
            - Commit `${{ github.sha }}`
            - Xcode 26 build for iOS 26 and newer

            **Unsigned IPA.** Sign it before installing, for example with Feather and a certificate from arcticsign. A distribution certificate covers normal installs, a developer certificate additionally allows JIT.

            Updates: add https://crzx.space/repo/repo.json as a source in Feather once, new builds then show up as updates.

            Pre-release: features may change or break between builds.
