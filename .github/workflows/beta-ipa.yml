name: Beta IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every commit gets its own build, so builds queue instead of cancelling each other.
concurrency:
  group: beta-ipa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish beta
    runs-on: macos-26
    env:
      PROJECT: IPTV-Player.xcodeproj
      SCHEME: IPTV-Player
      ARCHIVE_PATH: ${{ github.workspace }}/build/IPTV-Player.xcarchive

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "${{ github.workspace }}/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app inside the archive"
            exit 1
          fi

          # The IPA must always ship unsigned, signing happens later with Feather.
          if [ -d "$APP/_CodeSignature" ]; then
            echo "The app came out signed, but the beta IPA has to be unsigned."
            exit 1
          fi

          # Every build raises the version, so Feather and iOS see it as an update:
          # the major and minor part come from the project, the patch is the run number.
          PLIST="$APP/Info.plist"
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | cut -d. -f1-2)
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          IPA="$RUNNER_TEMP/IPTV-Player-${VERSION}-beta.${GITHUB_RUN_NUMBER}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$IPA"

          {
            echo "### Unsigned IPA ready"
            echo "- Version \`${VERSION}\`, build \`${GITHUB_RUN_NUMBER}\`"
            echo "- Bundle identifier \`${BUNDLE_ID}\`"
            echo "- Size $(du -h "$IPA" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-beta-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: IPTV Player ${{ steps.ipa.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ${{ steps.ipa.outputs.path }}
          body: |
            Changes: ${{ steps.ipa.outputs.subject }}

            - Version `${{ steps.ipa.outputs.version }}`, build `${{ github.run_number }}`
            - Bundle identifier `${{ steps.ipa.outputs.bundle_id }}`
            - Commit `${{ github.sha }}`
            - Xcode 26 build for iOS 26 and newer

            **Unsigned IPA.** Sign it before installing, for example with Feather and a certificate from arcticsign. A distribution certificate covers normal installs, a developer certificate additionally allows JIT.

            Easiest way to stay up to date: add the Feather source from the README once, new builds then show up as updates.

            Pre-release: features may change or break between builds.

      # The source lists every beta build, Feather reads it to offer the updates.
      - name: Update Feather source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BUNDLE_ID: ${{ steps.ipa.outputs.bundle_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          gh api "repos/${REPO}/releases?per_page=60" > "$RUNNER_TEMP/releases.json"

          jq \
            --arg repo "$REPO" \
            --arg owner "$OWNER" \
            --arg bundle "$BUNDLE_ID" \
            --arg branch "$DEFAULT_BRANCH" \
            '
            [ .[]
              | select(.draft == false)
              | . as $r
              | ($r.assets[]? | select(.name | test("^IPTV-Player-[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+\\.ipa$"))) as $a
              | ($a.name | capture("^IPTV-Player-(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)-beta\\.(?<b>[0-9]+)\\.ipa$")) as $m
              | {
                  version: $m.v,
                  buildVersion: $m.b,
                  date: $r.published_at,
                  downloadURL: $a.browser_download_url,
                  size: $a.size,
                  localizedDescription: (($r.body // "") | (capture("Changes: (?<c>[^\r\n]*)") | .c) // "Automatic beta build"),
                  minOSVersion: "26.0"
                }
            ]
            | sort_by(.buildVersion | tonumber) | reverse
            | .[0:30] as $versions
            | {
                name: "IPTV Player",
                identifier: ($bundle + ".source"),
                subtitle: "Beta builds of IPTV Player",
                description: "Every commit is built as an unsigned beta IPA. Sign it with Feather.",
                sourceURL: ("https://raw.githubusercontent.com/" + $repo + "/source/source.json"),
                website: ("https://github.com/" + $repo),
                tintColor: "0A84FF",
                apps: [
                  {
                    name: "IPTV Player",
                    bundleIdentifier: $bundle,
                    developerName: $owner,
                    subtitle: "Xtream Codes and M3U player",
                    localizedDescription: "A native iOS IPTV player for Xtream Codes panels and M3U playlists, built with SwiftUI and Liquid Glass.",
                    iconURL: ("https://raw.githubusercontent.com/" + $repo + "/" + $branch + "/IPTV-Player/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
                    tintColor: "0A84FF",
                    screenshotURLs: [],
                    versions: $versions,
                    version: ($versions[0].version),
                    versionDate: ($versions[0].date),
                    versionDescription: ($versions[0].localizedDescription),
                    downloadURL: ($versions[0].downloadURL),
                    size: ($versions[0].size),
                    appPermissions: { entitlements: [], privacy: {} }
                  }
                ],
                news: []
              }
            ' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/source.json"

          jq -e '.apps[0].versions | length > 0' "$RUNNER_TEMP/source.json" > /dev/null

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          SRC="$RUNNER_TEMP/source-branch"
          rm -rf "$SRC"

          if git ls-remote --exit-code --heads "$REMOTE" source > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch source "$REMOTE" "$SRC"
          else
            mkdir -p "$SRC"
            git -C "$SRC" init --quiet -b source
            git -C "$SRC" remote add origin "$REMOTE"
          fi

          git -C "$SRC" config user.name "github-actions[bot]"
          git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            cp "$RUNNER_TEMP/source.json" "$SRC/source.json"
            git -C "$SRC" add source.json
            if git -C "$SRC" diff --cached --quiet; then
              echo "Source is already up to date."
              break
            fi
            git -C "$SRC" commit --quiet -m "Update Feather source to ${{ steps.ipa.outputs.version }}"
            if git -C "$SRC" push --quiet origin source; then
              echo "Source updated to ${{ steps.ipa.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Could not push the source branch."
              exit 1
            fi
            git -C "$SRC" fetch --quiet origin source
            git -C "$SRC" reset --quiet --hard origin/source
          done
